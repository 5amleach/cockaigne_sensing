# Every adjustable number in the controller lives in this file.
# Code reads it at start-up. Nothing in the code carries its own copy of these values.

bus:
  url: ws://127.0.0.1:8765   # the sensing bus; the controller is one client among the others

resolume:
  host: 127.0.0.1
  osc_port: 7000      # clips are fired over OSC on UDP
  rest_port: 8080     # the composition (the clip names) is read over REST at start-up
  video_layer: 1      # the layer holding the landscape clips
  sound_layers: [2, 3]  # two layers that take turns playing each clip's sound, so one sound can
                        # fade out while the next fades in; [] runs the wall silent
  confirm_s: 2.0      # after a fire, confirm over REST within this long that the right clip connected
  confirm_poll_s: 0.5 # how often to look while confirming
  rest_timeout_s: 5.0 # how long one REST request may take at start-up
  confirm_timeout_s: 1.0  # how long one REST request may take while confirming

clock:
  clip_s: 60.0        # every clip is this long; the controller fires the next on its own clock
  audio_lead_s: 6.0   # a clip's sound starts this long before its picture; Karl's files carry
                      # six seconds either side of the sixty (his note of 21 Nov 2026)

map:
  # Arm letters confirmed by Sam, 5 October 2026. c (Cargo) is to be
  # confirmed against the clip files.
  arms: {a: architecture, u: furniture, s: storm, r: rivers, f: feast, h: herd, m: machinery, c: cargo}
  rings: 4

controller:
  arm_chooser: bandit      # "bandit" live; "fixed" pins default_arm, for tests and soaking one arm on site
  default_arm: machinery   # the arm used when arm_chooser is fixed
  tick_s: 0.1              # how often the loop checks its clock
  blind_after_s: 30        # no crowd message for this long: run blind, stepping the ring down each cycle
  reconnect_s: 5           # how often to retry the bus when the connection is down
  log_path: controller.log # log lines go here as well as to the terminal

occupancy:
  bands: [[1, solo], [2, small], [6, medium], [16, large]]  # lower edge of each band, by n_smooth from the crowd state
  band_size: {solo: 1, small: 1, medium: 1, large: 1}       # divides the action bias per band; all 1 from 25 Nov 2026
                                                            # so one person's phone still counts in a crowd (Sam: "tilt the
                                                            # odds harder"); was {solo: 1, small: 3, medium: 10, large: 20}

bandit:
  reward_delay_s: 10.0  # reward is the cohesion_smooth change from this long after clip start to clip end
  reward_scale: 0.15    # a change of +this much scores 1.0 and -this much scores 0.0; 0 change scores 0.5

action_bias:
  half_life_s: 90       # the lean decays with this half-life on the controller's clock
  lean_cap: 0.7         # the final lean per arm never exceeds this share of a Thompson draw (0..1); was 0.5,
                        # raised 25 Nov 2026 so a seen action usually wins: about 4 in 5 on a flat day
  rate_cap: 5.0         # a reported action rate above this is treated as this
  baseline_warmup_s: 120  # rates are treated as normal (1.0) until this much crowd history exists; was 600, cut 25 Nov 2026 (Sam)
  targets: {sitting: furniture, phone: machinery, drink: rivers, eat: feast}
  weights: {sitting: 1.0, phone: 1.0, drink: 1.0, eat: 1.0}   # 1.0 from 25 Nov 2026 (was 0.25): any excess reaches the cap fast
  sitting_baseline_s: 600    # sitting has no rate in Contract 2, so the controller keeps its own baseline
  sitting_baseline_floor: 0.02  # the baseline is never below this, so a first sitter reads as a spike, not infinity

hunger:
  # A pull towards arms the wall has not shown for a while (Sam, 28 Nov 2026), added to the
  # bandit's draw (0..1). Replayed on the 27 Nov public session with phone and sitting cued:
  # the six uncued arms went from 5% to 8% of moves each, the two cued arms from 37% and 31%
  # to 26% and 24%, and a seen action won its move about half the time instead of 3 in 4.
  per_min: 0.05   # pull gained per minute unseen
  cap: 0.5        # the most pull an arm can gain; reached after 10 minutes unseen

no_repeat:
  # The wall does not go back to a node it arrived at less than this many minutes ago (Sam,
  # 28 Nov 2026). Barren is exempt, a climb or descent the crowd asks for always goes ahead,
  # and 0 turns the rule off. A ring has eight nodes and a clip lasts a minute, so at 8 or
  # more a ring held that long has no node left that was not shown recently: the wall then
  # takes the one shown longest ago, touring the eight axes in turn.
  minutes: 8

personalities:
  # prior_strength is how many pseudo-observations the day starts with: low commits fast.
  # storm_prior is Storm's prior mean (risk appetite); every other arm starts at 0.5.
  # reward_scale and patience_s override the bandit section for the day.
  # All four parameter sets are starting guesses, to be tuned with real crowds.
  Courtier:   {prior_strength: 2,  storm_prior: 0.3,  reward_scale: 0.10, patience_s: 10}
  Operator:   {prior_strength: 6,  storm_prior: 0.5,  reward_scale: 0.15, patience_s: 15}
  Accountant: {prior_strength: 12, storm_prior: 0.35, reward_scale: 0.20, patience_s: 20}
  Naif:       {prior_strength: 1,  storm_prior: 0.65, reward_scale: 0.08, patience_s: 8}
personality_order: [Courtier, Operator, Accountant, Naif]  # the day of the year, modulo four, picks the day

ledger_path: ledger.jsonl   # the same file the sensing bus writes; the controller appends decision and outcome

sound:
  # Read only by `python -m cockaigne_controller.load_sounds`, which puts each clip's
  # sound file into the clip's own column on the sound layers. Run it once per composition.
  folder: C:/cockaigne e29/sound       # searched with its subfolders for *.wav
  name_pattern: "_([a-z][0-9][a-z][0-9])_au"   # where the clip name sits in a sound file's name
  renames: {}                          # files delivered under another clip's name: path ending -> true clip.
                                       # Empty since 24 Nov 2026: every clip has a file under its own name.
  play_mode: "Play Once & Clear"       # a sound plays through once and frees its layer

picture:
  # Read only by `python -m cockaigne_controller.load_pictures`, which points each clip
  # slot at its full-size file. Run it once, on a copy of the show composition.
  folders:                             # searched with their subfolders
    - C:/cockaigne wall masters/gimm25_then_proteus
    - D:/cockaigne wall masters
  glob: "*_GIMM_25_raw_prob4.mov"      # which files count as full-size masters
  name_pattern: "^([a-z][0-9][a-z][0-9])_"     # the clip name starts the file name
  resize: Fit                          # the whole picture, in proportion, inside the composition
  play_mode: "Play Once & Hold"        # set by `python -m cockaigne_controller.hold_pictures`: a clip that
                                       # ends a moment before the next fire holds its last frame instead of
                                       # looping back to its first (the frame-or-two flash, 27 Nov 2026)

overlays:
  # Short clips on their own layers above the landscape, fired a second or two after
  # someone sits or uses a phone (Sam, 28 Nov 2026), so a visitor sees that it counted.
  # clip: the clip's name in the composition; action: the crowd count that triggers it;
  # rest_s: the least time between two runs; says: the data wall's line when it fires.
  chairs: {clip: chairs_ekstrem_v2_hapalpha_8064x1176, action: sitting, rest_s: 300, says: "PERSON SITTING: RELEASING CHAIRS"}
  pig:    {clip: pig_walk_bottom_hapalpha_8064x1176,    action: phone,   rest_s: 600, says: "PHONE USE: RELEASING PIG"}