# Bench configuration for the two 7 September venue clips. Same numbers as sensing.yaml,
# with the two bench cameras in place of the gallery cameras. Used by tests and bench notes.
floor:
  width_m: 6.1
  length_m: 7.4
cameras:
- name: venueA
  ip: n/a
  user: n/a
  stream: main
  homography: config/homography_venueA.json
  floor_polygon: []
- name: venueB
  ip: n/a
  user: n/a
  stream: main
  homography: config/homography_venueB.json
  floor_polygon: []
detector:
  model: yolo11s.pt
  imgsz: 1280
  conf: 0.25
  tracker: bytetrack.yaml
  device: auto
  min_track_age_s: 1.0
floor_tracker:
  merge_distance_m: 0.5
  drop_after_s: 3.0
  velocity_window_s: 1.0
cohesion:
  smooth_window_s: 10.0
  still_speed_mps: 0.15
  occupancy_window_s: 10.0
  blend_weight_by_n:
  - - 1
    - 0.0
  - - 2
    - 0.5
  - - 3
    - 0.9
  - - 4
    - 1.0
  proxy_ceiling: 0.75
  proxy_dwell_full_s: 120
  proxy_spot_x_m: 3.05
  proxy_spot_y_m: 3.5
  proxy_spot_full_m: 1.0
  proxy_spot_zero_m: 4.0
  rise_rate_per_s: 0.02
  fall_rate_per_s: 0.01
  ring_up:
  - 0.2
  - 0.4
  - 0.6
  - 0.8
  ring_down:
  - 0.1
  - 0.3
  - 0.5
  - 0.7
mood:
  label_dwell_s: 8.0
  sitting_ratio: 0.75
actions:
  model: qwen2.5vl:3b
  interval_s: 3.0
  agree_readings: 2
  baseline_window_s: 600
  enabled:
  - phone
  - drink
  - eat
bus:
  host: 127.0.0.1
  port: 8765
  ledger_path: ledger.jsonl
