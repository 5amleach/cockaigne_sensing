[project]
name = "cockaigne_sensing"
version = "0.1.0"
description = "Audience sensing for the Cockaigne installation: cameras in, crowd state out."
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "websockets>=13.0",  # the asyncio client/server API this code imports arrived in 13
    "scipy>=1.11",
    "matplotlib>=3.8",
    "python-osc>=1.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cockaigne_sensing*", "cockaigne_controller*"]
